document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

          <span>Sobre Faro<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Heading -->\n      <h3 style=\"font-family: 'DM Serif Display', serif; font-size: 32px; color: {{ headingColor }}; margin: 0 0 8px; transition: color 0.5s\">Un lugar seguro cuando más lo necesitas<\u002Fh3>\n      <p style=\"font-size: 15px; color: {{ bodyColor }}; margin: 0 0 28px; max-width: 480px; line-height: 1.6; transition: color 0.5s\">Herramientas y técnicas interactivas de calma para momentos de ansiedad y crisis de pánico.<\u002Fp>\n\n      <!-- Buttons -->\n      <div style=\"display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap\">\n        <div style=\"padding: 12px 28px; border-radius: 8px; background: {{ btnPrimaryBg }}; color: {{ btnPrimaryText }}; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.5s\">Necesito ayuda ahora<\u002Fdiv>\n        <div style=\"padding: 12px 28px; border-radius: 8px; background: {{ btnSecondaryBg }}; color: {{ btnSecondaryText }}; font-size: 14px; font-weight: 600; border: 1.5px solid {{ btnSecondaryBorder }}; cursor: pointer; transition: all 0.5s\">Ver herramientas<\u002Fdiv>\n        <div style=\"padding: 12px 28px; border-radius: 8px; background: {{ btnDisabledBg }}; color: {{ btnDisabledText }}; font-size: 14px; font-weight: 600; cursor: not-allowed; opacity: 0.6; transition: all 0.5s\">Deshabilitado<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Cards -->\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px\">\n        <div style=\"border-radius: 12px; padding: 24px; background: {{ cardBg }}; border: 1px solid {{ cardBorder }}; transition: all 0.5s\">\n          <div style=\"font-size: 24px; margin-bottom: 12px\">🫁<\u002Fdiv>\n          <div style=\"font-size: 15px; font-weight: 600; color: {{ headingColor }}; margin-bottom: 6px; transition: color 0.5s\">Respiración cuadrada<\u002Fdiv>\n          <div style=\"font-size: 13px; color: {{ bodyColor }}; line-height: 1.5; transition: color 0.5s\">Técnica 4-4-4-4 con guía visual interactiva.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-radius: 12px; padding: 24px; background: {{ cardBg }}; border: 1px solid {{ cardBorder }}; transition: all 0.5s\">\n          <div style=\"font-size: 24px; margin-bottom: 12px\">🖐️<\u002Fdiv>\n          <div style=\"font-size: 15px; font-weight: 600; color: {{ headingColor }}; margin-bottom: 6px; transition: color 0.5s\">Grounding 5-4-3-2-1<\u002Fdiv>\n          <div style=\"font-size: 13px; color: {{ bodyColor }}; line-height: 1.5; transition: color 0.5s\">Técnica de anclaje sensorial paso a paso.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-radius: 12px; padding: 24px; background: {{ cardBg }}; border: 1px solid {{ cardBorder }}; transition: all 0.5s\">\n          <div style=\"font-size: 24px; margin-bottom: 12px\">💆<\u002Fdiv>\n          <div style=\"font-size: 15px; font-weight: 600; color: {{ headingColor }}; margin-bottom: 6px; transition: color 0.5s\">Relajación muscular<\u002Fdiv>\n          <div style=\"font-size: 13px; color: {{ bodyColor }}; line-height: 1.5; transition: color 0.5s\">Guía de tensión y distensión muscular.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Semantic states -->\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px\">\n        <div style=\"padding: 10px 16px; border-radius: 8px; background: {{ successBg }}; color: {{ successText }}; font-size: 13px; font-weight: 500; transition: all 0.5s\">✓ Ejercicio completado<\u002Fdiv>\n        <div style=\"padding: 10px 16px; border-radius: 8px; background: {{ warningBg }}; color: {{ warningText }}; font-size: 13px; font-weight: 500; transition: all 0.5s\">⚠ Recuerda respirar<\u002Fdiv>\n        <div style=\"padding: 10px 16px; border-radius: 8px; background: {{ errorBg }}; color: {{ errorText }}; font-size: 13px; font-weight: 500; transition: all 0.5s\">✕ Algo salió mal<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Input -->\n      <div style=\"display: flex; gap: 16px; align-items: flex-start\">\n        <div style=\"flex: 1\">\n          <label style=\"font-size: 13px; font-weight: 600; color: {{ headingColor }}; margin-bottom: 6px; display: block; transition: color 0.5s\">¿Cómo te sientes hoy?<\u002Flabel>\n          <div style=\"padding: 12px 16px; border-radius: 8px; background: {{ inputBg }}; border: 1.5px solid {{ inputBorder }}; font-size: 14px; color: {{ placeholderColor }}; transition: all 0.5s\">Escribe aquí...<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1\">\n          <label style=\"font-size: 13px; font-weight: 600; color: {{ headingColor }}; margin-bottom: 6px; display: block; transition: color 0.5s\">Nivel de ansiedad<\u002Flabel>\n          <div style=\"height: 8px; border-radius: 4px; background: {{ sliderTrack }}; position: relative; margin-top: 18px; transition: all 0.5s\">\n            <div style=\"width: 40%; height: 100%; border-radius: 4px; background: {{ sliderFill }}; transition: all 0.5s\"><\u002Fdiv>\n            <div style=\"width: 20px; height: 20px; border-radius: 10px; background: {{ sliderThumb }}; border: 2px solid white; position: absolute; left: 38%; top: -6px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); transition: all 0.5s\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════════════ -->\n<!-- SECTION 3: SURFACE ELEVATION -->\n<!-- ═══════════════════════════════════════════════════ -->\n<div style=\"padding: 0 44px 48px\">\n  <div style=\"max-width: 1200px; margin: 0 auto\">\n    <h2 style=\"font-family: 'DM Serif Display', serif; font-size: 28px; color: #3D2C1E; margin: 0 0 8px\">Elevación de superficies<\u002Fh2>\n    <p style=\"font-size: 14px; color: #8B7355; margin: 0 0 32px\">Cómo se diferencian los niveles: fondo → tarjeta → modal → tooltip.<\u002Fp>\n\n    <div style=\"border-radius: 16px; padding: 48px; background: {{ gradientSurface }}; border: 1px solid {{ previewBorder }}; transition: all 0.5s; position: relative\">\n      <div style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: {{ mutedLabel }}; margin-bottom: 8px; transition: color 0.5s\">Nivel 0 — Fondo<\u002Fdiv>\n\n      <div style=\"border-radius: 12px; padding: 32px; background: {{ gradientCard }}; border: 1px solid {{ cardBorder }}; margin-top: 12px; transition: all 0.5s\">\n        <div style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: {{ mutedLabel }}; margin-bottom: 8px; transition: color 0.5s\">Nivel 1 — Tarjeta<\u002Fdiv>\n\n        <div style=\"border-radius: 10px; padding: 28px; background: {{ modalBg }}; border: 1px solid {{ modalBorder }}; box-shadow: {{ modalShadow }}; margin-top: 12px; transition: all 0.5s\">\n          <div style=\"font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: {{ mutedLabel }}; margin-bottom: 8px; transition: color 0.5s\">Nivel 2 — Modal / Overlay<\u002Fdiv>\n\n          <div style=\"border-radius: 8px; padding: 12px 16px; background: {{ tooltipBg }}; color: {{ tooltipText }}; font-size: 13px; margin-top: 12px; display: inline-block; transition: all 0.5s\">Nivel 3 — Tooltip<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════════════════════════════════════════ -->\n<!-- SECTION 4: CSS VARIABLES -->\n<!-- ═══════════════════════════════════════════════════ -->\n<div style=\"padding: 0 44px 64px\">\n  <div style=\"max-width: 1200px; margin: 0 auto\">\n    <h2 style=\"font-family: 'DM Serif Display', serif; font-size: 28px; color: #3D2C1E; margin: 0 0 8px\">Variables CSS<\u002Fh2>\n    <p style=\"font-size: 14px; color: #8B7355; margin: 0 0 24px\">Copia y pega en tu proyecto Tailwind. Todas las variables cambian con la clase <code style=\"background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px\">.dark<\u002Fcode> en el root.<\u002Fp>\n\n    <div style=\"border-radius: 12px; background: #1E1A2E; padding: 28px 32px; overflow-x: auto\">\n      <pre style=\"margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.7; color: #E8DFD0; white-space: pre-wrap\">{{ cssCode }}<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot; },\n  &quot;mode&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;],\n    &quot;default&quot;: &quot;light&quot;,\n    &quot;tsType&quot;: &quot;string&quot;\n  }\n}\">\n\nclass Component extends DCLogic {\n  state = { dark: false };\n\n  renderVals() {\n    const dark = this.state.dark;\n\n    // ═══════════════════════════════════════════\n    // LIGHT MODE — Early Sunset\n    // ═══════════════════════════════════════════\n    const light = {\n      // Backgrounds\n      bgPrimary:    '#FAF3E8',   // warm cream — main page\n      bgSecondary:  '#F2E6D0',   // sand — sections, hero\n      bgTertiary:   '#EBD9BE',   // deeper sand — contrast areas\n      bgNavbar:     '#6B4226',   // warm umber — nav (sunset earth)\n\n      // Text\n      textPrimary:   '#3A2518',  // warm espresso\n      textSecondary: '#7A6248',  // muted brown\n      textMuted:     '#A8937A',  // faded warm\n      textOnDark:    '#F5EBD9',  // cream on dark\n\n      // Accents\n      accentPrimary:   '#C8882E', // warm amber — main CTA\n      accentSecondary: '#8B5A3C', // terracotta — secondary\n      accentPurple:    '#6B4226', // warm umber — headings (matches navbar)\n      accentGold:      '#D4A33A', // bright gold — highlights\n\n      // Semantic\n      success:    '#5A7A4A',\n      successBg:  '#EDF5E6',\n      warning:    '#A0742A',\n      warningBg:  '#FDF3E0',\n      error:      '#A34838',\n      errorBg:    '#FCEAE6',\n\n      // Borders & surfaces\n      border:       '#E0D0B8',\n      borderSubtle: '#EDE3D2',\n      cardBg:       '#FFFAF2',\n      modalBg:      '#FFFFFF',\n      modalBorder:  '#E8DCC8',\n      tooltipBg:    '#3A2518',\n      tooltipText:  '#F5EBD9',\n\n      // Inputs\n      inputBg:      '#FFFDF8',\n      inputBorder:  '#D8C8B0',\n\n      // Interactive\n      sliderTrack: '#E8DCC8',\n      sliderFill:  '#C8882E',\n      sliderThumb: '#C8882E',\n\n      // Gradients\n      gradient: 'linear-gradient(135deg, #FAF3E8 0%, #F2DDB8 30%, #E8C488 60%, #D4A060 85%, #C88A40 100%)',\n      gradientHero: 'linear-gradient(180deg, #FAF3E8 0%, #F5E2C0 25%, #EDD0A0 50%, #E0B878 75%, #C8882E 100%)',\n      gradientSurface: 'linear-gradient(160deg, #FAF3E8 0%, #F5E8D0 100%)',\n      gradientCard: 'linear-gradient(180deg, #FFFDF8 0%, #FAF0E0 100%)',\n      gradientNavbar: 'linear-gradient(90deg, #6B4226 0%, #8B5A30 50%, #A06830 100%)',\n    };\n\n    // ═══════════════════════════════════════════\n    // DARK MODE — Late Sunset / Twilight\n    // ═══════════════════════════════════════════\n    const darkMode = {\n      // Backgrounds\n      bgPrimary:    '#1E1528',   // deep plum night\n      bgSecondary:  '#281D35',   // slightly lighter purple\n      bgTertiary:   '#342848',   // elevated purple\n      bgNavbar:     '#5A2040',   // plum — visible against bg\n\n      // Text\n      textPrimary:   '#F0E4D0',  // warm cream\n      textSecondary: '#C0A88E',  // muted sand\n      textMuted:     '#8A7468',  // faded warm\n      textOnDark:    '#F0E4D0',\n\n      // Accents\n      accentPrimary:   '#E09058', // warm coral — horizon glow\n      accentSecondary: '#D4783E', // deeper coral\n      accentPurple:    '#B090C8', // soft lavender\n      accentGold:      '#D4A850', // warm gold\n\n      // Semantic\n      success:    '#7CB06A',\n      successBg:  '#1A2818',\n      warning:    '#D4A040',\n      warningBg:  '#2A2218',\n      error:      '#D06858',\n      errorBg:    '#2A1818',\n\n      // Borders & surfaces\n      border:       '#3E2E50',\n      borderSubtle: '#2E2040',\n      cardBg:       '#261C34',\n      modalBg:      '#302444',\n      modalBorder:  '#402E58',\n      tooltipBg:    '#E09058',\n      tooltipText:  '#1E1528',\n\n      // Inputs\n      inputBg:      '#221830',\n      inputBorder:  '#3E2E50',\n\n      // Interactive\n      sliderTrack: '#3E2E50',\n      sliderFill:  '#E09058',\n      sliderThumb: '#E09058',\n\n      // Gradients\n      gradient: 'linear-gradient(135deg, #1E1528 0%, #2E1E3E 25%, #482848 50%, #683050 70%, #884040 85%, #A06040 100%)',\n      gradientHero: 'linear-gradient(180deg, #1E1528 0%, #2A1830 25%, #3E2040 50%, #582848 75%, #7A3848 85%, #A06040 100%)',\n      gradientSurface: 'linear-gradient(160deg, #1E1528 0%, #281D35 100%)',\n      gradientCard: 'linear-gradient(180deg, #261C34 0%, #2E2240 100%)',\n      gradientNavbar: 'linear-gradient(90deg, #5A2040 0%, #6B2848 50%, #7A3050 100%)',\n    };\n\n    const p = dark ? darkMode : light;\n\n    const cssCode = `:root {\n  /* ── Fondos ── */\n  --faro-bg-primary: ${light.bgPrimary};\n  --faro-bg-secondary: ${light.bgSecondary};\n  --faro-bg-tertiary: ${light.bgTertiary};\n  --faro-bg-navbar: ${light.bgNavbar};\n\n  /* ── Texto ── */\n  --faro-text-primary: ${light.textPrimary};\n  --faro-text-secondary: ${light.textSecondary};\n  --faro-text-muted: ${light.textMuted};\n  --faro-text-on-dark: ${light.textOnDark};\n\n  /* ── Acentos ── */\n  --faro-accent-primary: ${light.accentPrimary};\n  --faro-accent-secondary: ${light.accentSecondary};\n  --faro-accent-purple: ${light.accentPurple};\n  --faro-accent-gold: ${light.accentGold};\n\n  /* ── Estados semánticos ── */\n  --faro-success: ${light.success};\n  --faro-success-bg: ${light.successBg};\n  --faro-warning: ${light.warning};\n  --faro-warning-bg: ${light.warningBg};\n  --faro-error: ${light.error};\n  --faro-error-bg: ${light.errorBg};\n\n  /* ── Bordes ── */\n  --faro-border: ${light.border};\n  --faro-border-subtle: ${light.borderSubtle};\n\n  /* ── Superficies ── */\n  --faro-card-bg: ${light.cardBg};\n  --faro-modal-bg: ${light.modalBg};\n  --faro-modal-border: ${light.modalBorder};\n  --faro-tooltip-bg: ${light.tooltipBg};\n  --faro-tooltip-text: ${light.tooltipText};\n\n  /* ── Inputs ── */\n  --faro-input-bg: ${light.inputBg};\n  --faro-input-border: ${light.inputBorder};\n\n  /* ── Interactivos ── */\n  --faro-slider-track: ${light.sliderTrack};\n  --faro-slider-fill: ${light.sliderFill};\n\n  /* ── Degradados ── */\n  --faro-gradient-hero: ${light.gradientHero};\n  --faro-gradient-surface: ${light.gradientSurface};\n  --faro-gradient-card: ${light.gradientCard};\n  --faro-gradient-navbar: ${light.gradientNavbar};\n}\n\n.dark {\n  /* ── Fondos ── */\n  --faro-bg-primary: ${darkMode.bgPrimary};\n  --faro-bg-secondary: ${darkMode.bgSecondary};\n  --faro-bg-tertiary: ${darkMode.bgTertiary};\n  --faro-bg-navbar: ${darkMode.bgNavbar};\n\n  /* ── Texto ── */\n  --faro-text-primary: ${darkMode.textPrimary};\n  --faro-text-secondary: ${darkMode.textSecondary};\n  --faro-text-muted: ${darkMode.textMuted};\n  --faro-text-on-dark: ${darkMode.textOnDark};\n\n  /* ── Acentos ── */\n  --faro-accent-primary: ${darkMode.accentPrimary};\n  --faro-accent-secondary: ${darkMode.accentSecondary};\n  --faro-accent-purple: ${darkMode.accentPurple};\n  --faro-accent-gold: ${darkMode.accentGold};\n\n  /* ── Estados semánticos ── */\n  --faro-success: ${darkMode.success};\n  --faro-success-bg: ${darkMode.successBg};\n  --faro-warning: ${darkMode.warning};\n  --faro-warning-bg: ${darkMode.warningBg};\n  --faro-error: ${darkMode.error};\n  --faro-error-bg: ${darkMode.errorBg};\n\n  /* ── Bordes ── */\n  --faro-border: ${darkMode.border};\n  --faro-border-subtle: ${darkMode.borderSubtle};\n\n  /* ── Superficies ── */\n  --faro-card-bg: ${darkMode.cardBg};\n  --faro-modal-bg: ${darkMode.modalBg};\n  --faro-modal-border: ${darkMode.modalBorder};\n  --faro-tooltip-bg: ${darkMode.tooltipBg};\n  --faro-tooltip-text: ${darkMode.tooltipText};\n\n  /* ── Inputs ── */\n  --faro-input-bg: ${darkMode.inputBg};\n  --faro-input-border: ${darkMode.inputBorder};\n\n  /* ── Interactivos ── */\n  --faro-slider-track: ${darkMode.sliderTrack};\n  --faro-slider-fill: ${darkMode.sliderFill};\n\n  /* ── Degradados ── */\n  --faro-gradient-hero: ${darkMode.gradientHero};\n  --faro-gradient-surface: ${darkMode.gradientSurface};\n  --faro-gradient-card: ${darkMode.gradientCard};\n  --faro-gradient-navbar: ${darkMode.gradientNavbar};\n}`;\n\n    return {\n      // Toggle\n      toggleMode: () => this.setState(s => ({ dark: !s.dark })),\n      toggleBg: dark ? '#5B3D6B' : '#C8882E',\n      toggleLeft: dark ? '27px' : '3px',\n      lightOpacity: dark ? '0.4' : '1',\n      darkOpacity: dark ? '1' : '0.4',\n\n      // Gradient strip\n      gradientStrip: p.gradient,\n\n      // Background colors\n      bgColors: [\n        { name: 'Fondo principal', hex: p.bgPrimary, role: '--faro-bg-primary' },\n        { name: 'Fondo secundario', hex: p.bgSecondary, role: '--faro-bg-secondary' },\n        { name: 'Fondo terciario', hex: p.bgTertiary, role: '--faro-bg-tertiary' },\n        { name: 'Navbar', hex: p.bgNavbar, role: '--faro-bg-navbar' },\n      ],\n\n      // Text colors\n      textColors: [\n        { name: 'Texto principal', hex: p.textPrimary, role: '--faro-text-primary', preview: p.bgPrimary },\n        { name: 'Texto secundario', hex: p.textSecondary, role: '--faro-text-secondary', preview: p.bgPrimary },\n        { name: 'Texto muted', hex: p.textMuted, role: '--faro-text-muted', preview: p.bgPrimary },\n        { name: 'Texto sobre oscuro', hex: p.textOnDark, role: '--faro-text-on-dark', preview: p.bgNavbar },\n      ],\n\n      // Accent colors\n      accentColors: [\n        { name: 'Acento primario', hex: p.accentPrimary, role: '--faro-accent-primary · Botones, CTA' },\n        { name: 'Acento secundario', hex: p.accentSecondary, role: '--faro-accent-secondary · Links secundarios' },\n        { name: 'Acento púrpura', hex: p.accentPurple, role: '--faro-accent-purple · Títulos, iconos' },\n        { name: 'Acento dorado', hex: p.accentGold, role: '--faro-accent-gold · Highlights, badges' },\n      ],\n\n      // Semantic colors\n      semanticColors: [\n        { name: 'Éxito', hex: p.success, role: `Fondo: ${p.successBg}` },\n        { name: 'Advertencia', hex: p.warning, role: `Fondo: ${p.warningBg}` },\n        { name: 'Error', hex: p.error, role: `Fondo: ${p.errorBg}` },\n      ],\n\n      // Border colors\n      borderColors: [\n        { name: 'Borde principal', hex: p.border, role: '--faro-border' },\n        { name: 'Borde sutil', hex: p.borderSubtle, role: '--faro-border-subtle' },\n        { name: 'Borde modal', hex: p.modalBorder, role: '--faro-modal-border' },\n      ],\n\n      // Gradients\n      gradientHero: p.gradientHero,\n      gradientSurface: p.gradientSurface,\n      gradientCard: p.gradientCard,\n      gradientNavbar: p.gradientNavbar,\n\n      // Component preview values\n      previewBg: p.gradientSurface,\n      previewBorder: p.border,\n      navBg: p.gradientNavbar,\n      navText: p.textOnDark,\n      navLink: dark ? '#F0DCC8' : '#F5E8D8',\n      headingColor: p.accentPurple,\n      bodyColor: p.textSecondary,\n      mutedLabel: p.textMuted,\n\n      // Buttons\n      btnPrimaryBg: p.accentPrimary,\n      btnPrimaryText: dark ? '#1E1528' : '#FFFDF8',\n      btnSecondaryBg: 'transparent',\n      btnSecondaryText: p.accentPrimary,\n      btnSecondaryBorder: p.accentPrimary,\n      btnDisabledBg: p.bgTertiary,\n      btnDisabledText: p.textMuted,\n\n      // Cards\n      cardBg: p.gradientCard,\n      cardBorder: p.borderSubtle,\n\n      // Semantic states\n      successBg: p.successBg,\n      successText: p.success,\n      warningBg: p.warningBg,\n      warningText: p.warning,\n      errorBg: p.errorBg,\n      errorText: p.error,\n\n      // Inputs\n      inputBg: p.inputBg,\n      inputBorder: p.inputBorder,\n      placeholderColor: p.textMuted,\n\n      // Slider\n      sliderTrack: p.sliderTrack,\n      sliderFill: p.sliderFill,\n      sliderThumb: p.sliderThumb,\n\n      // Elevation\n      modalBg: p.modalBg,\n      modalBorder: p.modalBorder,\n      modalShadow: dark ? '0 8px 32px rgba(0,0,0,0.4)' : '0 8px 32px rgba(0,0,0,0.08)',\n      tooltipBg: p.tooltipBg,\n      tooltipText: p.tooltipText,\n\n      // CSS Code\n      cssCode,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
