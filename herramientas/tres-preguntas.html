<!DOCTYPE html>
<html lang="es" data-theme="faro-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres preguntas para una vida feliz · Faro</title>
    <script>(function(){try{var t=localStorage.getItem("faro-theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="faro-dark";if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/faro-base.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        /* Fondo atardecer suave para el ritual nocturno */
        main { background: var(--faro-gradient-surface); }
        .cal-semana { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; }
        .faro-cal-cell { width: 16px; height: 16px; cursor: default; }
        .faro-cal-cell.done { cursor: pointer; }
    </style>
</head>
<body class="bg-base-100">

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar bg-neutral shadow-sm px-4 lg:px-8 sticky top-0 z-50">
    <div class="navbar-start">
        <a href="../index.html" class="flex items-center gap-2 text-neutral-content">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.5 3h-5z"/><rect x="9.5" y="5" width="5" height="2.5" rx="0.3"/><path d="M10 7.5L8.5 21h7L14 7.5z"/><path d="M9 13.5h6"/><path d="M6 21h12"/><path d="M16 5.5l2.5-1.3M16 6.8l2.6.4M8 5.5L5.5 4.2M8 6.8l-2.6.4"/>
            </svg>
            <span class="text-xl font-semibold font-display">Faro</span>
        </a>
    </div>
    <div class="navbar-center hidden md:flex">
        <ul class="menu menu-horizontal gap-1">
            <li><a href="../index.html" class="text-neutral-content hover:text-accent">Inicio</a></li>
            <li><a href="../herramientas.html" class="text-neutral-content hover:text-accent">Herramientas</a></li>
            <li><a href="../sobre-faro.html" class="text-neutral-content hover:text-accent">Sobre Faro</a></li>
        </ul>
    </div>
    <div class="navbar-end">
        <a href="../herramientas.html" class="btn btn-ghost text-neutral-content gap-1 px-2 md:hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Herramientas
        </a>
        <button id="theme-toggle" class="btn btn-ghost btn-circle text-neutral-content" aria-label="Cambiar tema">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
    </div>
</nav>

<main class="relative overflow-hidden" style="min-height: calc(100vh - 64px);">
    <div class="tool-bokeh-bg"></div>

    <div class="relative max-w-xl mx-auto px-4 py-8 md:py-12">

        <!-- FORMULARIO DE HOY -->
        <section id="s-hoy" class="faro-screen active">
            <div class="tool-stage relative overflow-hidden p-6 md:p-10">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h1 class="font-display text-3xl font-semibold text-base-content text-center">Antes de dormir...</h1>
                    <p class="text-base text-center" style="color: var(--faro-text-secondary);">
                        Satisfacción, no perfección. Lo que hiciste aunque no fuera agradable también cuenta.
                    </p>

                    <div class="space-y-5">
                        <div>
                            <label for="p1" class="block font-medium text-base-content mb-2">¿Qué pequeña cosa hice hoy de la que estoy satisfecho/a?</label>
                            <textarea id="p1" class="faro-textarea" style="min-height: 4.5rem;"></textarea>
                        </div>
                        <div>
                            <label for="p2" class="block font-medium text-base-content mb-2">¿Qué pequeña cosa hizo alguien por mí, por la que estoy agradecido/a?</label>
                            <textarea id="p2" class="faro-textarea" style="min-height: 4.5rem;"></textarea>
                        </div>
                        <div>
                            <label for="p3" class="block font-medium text-base-content mb-2">¿Qué otra pequeña cosa hice hoy de la que estoy satisfecho/a?</label>
                            <textarea id="p3" class="faro-textarea" style="min-height: 4.5rem;"></textarea>
                        </div>
                    </div>

                    <p id="ya-guardado" class="hidden text-base text-center p-3 rounded-xl" style="background: var(--faro-success-bg); color: var(--color-success);"></p>

                    <button id="btn-guardar" class="faro-btn-big faro-btn-primary">Guardar y dormir bien</button>
                    <button id="btn-historial" class="block mx-auto text-base underline" style="color: var(--faro-text-muted);">Ver mi historial</button>
                </div>
            </div>
        </section>

        <!-- HISTORIAL -->
        <section id="s-historial" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-6 md:p-10">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h2 class="font-display text-2xl md:text-3xl font-semibold text-base-content text-center">Tus noches</h2>
                    <p id="racha" class="text-center faro-instruction" style="color: var(--faro-text-secondary);"></p>

                    <!-- Calendario tipo racha (12 semanas) -->
                    <div class="overflow-x-auto pb-1">
                        <div id="calendario" class="flex gap-[3px] justify-center min-w-max" role="img" aria-label="Calendario de días completados"></div>
                    </div>
                    <p class="text-sm text-center" style="color: var(--faro-text-muted);">Cada cuadrado es un día. Los cálidos son noches en que escribiste. Toca uno para releerlo.</p>

                    <!-- Día seleccionado -->
                    <div id="dia-detalle" class="hidden faro-option-card p-5 space-y-2"></div>

                    <!-- Lista completa: releer semanas de pequeños logros es una intervención en sí misma -->
                    <details class="faro-option-card p-4">
                        <summary class="cursor-pointer font-medium text-base-content">Leer todo mi historial</summary>
                        <div id="lista-completa" class="mt-4 space-y-4"></div>
                    </details>

                    <button class="faro-btn-big faro-btn-ghost" id="btn-volver">Volver</button>
                </div>
            </div>
        </section>

    </div>
</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/tres-preguntas.js"></script>
</body>
</html>
