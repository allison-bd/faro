<!DOCTYPE html>
<html lang="es" data-theme="faro-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaraciones de seguridad · Faro</title>
    <script>(function(){try{var t=localStorage.getItem("faro-theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="faro-dark";if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/faro-base.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-base-100">

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar bg-neutral shadow-sm px-4 lg:px-8 sticky top-0 z-50">
    <div class="navbar-start">
        <a href="../index.html" class="flex items-center gap-2 text-neutral-content">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.5 3h-5z"/><rect x="9.5" y="5" width="5" height="2.5" rx="0.3"/><path d="M10 7.5L8.5 21h7L14 7.5z"/><path d="M9 13.5h6"/><path d="M6 21h12"/><path d="M16 5.5l2.5-1.3M16 6.8l2.6.4M8 5.5L5.5 4.2M8 6.8l-2.6.4"/>
            </svg>
            <span class="text-xl font-semibold font-display">Faro</span>
        </a>
    </div>
    <div class="navbar-center hidden md:flex">
        <ul class="menu menu-horizontal gap-1">
            <li><a href="../index.html" class="text-neutral-content hover:text-accent">Inicio</a></li>
            <li><a href="../herramientas.html" class="text-neutral-content hover:text-accent">Herramientas</a></li>
            <li><a href="../sobre-faro.html" class="text-neutral-content hover:text-accent">Sobre Faro</a></li>
        </ul>
    </div>
    <div class="navbar-end">
        <a href="../herramientas.html" class="btn btn-ghost text-neutral-content gap-1 px-2 md:hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Herramientas
        </a>
        <button id="theme-toggle" class="btn btn-ghost btn-circle text-neutral-content" aria-label="Cambiar tema">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
    </div>
</nav>

<main class="relative overflow-hidden bg-base-200 faro-surface" style="min-height: calc(100vh - 64px);">
    <div class="tool-bokeh-bg"></div>
    <div class="tool-glow absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="width: 480px; height: 480px;"></div>

    <div class="relative max-w-xl mx-auto px-4 py-8 md:py-12">

        <!-- ENTRADA: ELEGIR CATEGORÍA -->
        <section id="s-entrada" class="faro-screen active">
            <div class="tool-stage relative overflow-hidden p-6 md:p-10">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h1 class="font-display text-3xl font-semibold text-base-content text-center">¿Qué tipo de frase necesitas ahora?</h1>
                    <div class="space-y-3">
                        <button class="faro-option-card w-full p-5 flex items-center gap-4" data-categoria="cuerpo">
                            <svg class="text-primary shrink-0" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.2A4.8 4.8 0 0 0 13.6 5l-1.6 1.6L10.4 5A4.8 4.8 0 0 0 2 8.8c0 2 1.5 3.7 3 5.2l7 6.5z"/><path d="M3.5 12h4l1.5-3 2.5 5 2-4 1.5 2h5"/></svg>
                            <span>
                                <span class="font-semibold text-lg text-primary block">Qué le pasa a mi cuerpo</span>
                                <span class="text-base" style="color: var(--faro-text-secondary);">Lo que sientes tiene explicación.</span>
                            </span>
                        </button>
                        <button class="faro-option-card w-full p-5 flex items-center gap-4" data-categoria="antes">
                            <svg class="text-primary shrink-0" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8l1.2 2.4 2.6.4-1.9 1.9.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.9 2.6-.4z"/></svg>
                            <span>
                                <span class="font-semibold text-lg text-primary block">Ya he podido antes</span>
                                <span class="text-base" style="color: var(--faro-text-secondary);">Tu historia te respalda.</span>
                            </span>
                        </button>
                        <button class="faro-option-card w-full p-5 flex items-center gap-4" data-categoria="presente">
                            <svg class="text-primary shrink-0" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V19"/><path d="M6 12h12"/><path d="M7 19c1.5 1.8 3 2.5 5 2.5s3.5-.7 5-2.5"/></svg>
                            <span>
                                <span class="font-semibold text-lg text-primary block">Estoy aquí, estoy a salvo</span>
                                <span class="text-base" style="color: var(--faro-text-secondary);">Anclarte a este momento.</span>
                            </span>
                        </button>
                        <button id="card-mias" class="faro-option-card w-full p-5 flex items-center gap-4 hidden" data-categoria="mias">
                            <svg class="text-primary shrink-0" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20l-7-7a4.8 4.8 0 0 1 7-6.6A4.8 4.8 0 0 1 19 13z"/></svg>
                            <span>
                                <span class="font-semibold text-lg text-primary block">Mis frases</span>
                                <span class="text-base" style="color: var(--faro-text-secondary);">Las que escribiste tú.</span>
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- LECTURA DE FRASES -->
        <section id="s-frases" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-6 md:p-10 text-center">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-8">
                    <p id="nombre-categoria" class="text-sm font-semibold uppercase tracking-wide" style="color: var(--faro-text-muted);"></p>

                    <!-- La frase respira contigo: se expande 4 s y se contrae 4 s -->
                    <div class="min-h-48 flex items-center justify-center px-2">
                        <p id="frase" class="faro-breathe font-display font-medium leading-snug text-base-content" style="font-size: clamp(24px, 6vw, 34px);" aria-live="polite"></p>
                    </div>

                    <div class="flex items-center justify-center gap-6">
                        <button id="btn-anterior" class="btn btn-circle btn-ghost" aria-label="Frase anterior">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <button id="btn-favorita" class="btn btn-circle btn-ghost text-primary" aria-label="Marcar como favorita" aria-pressed="false">
                            <svg id="icono-corazon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.2A4.8 4.8 0 0 0 13.6 5l-1.6 1.6L10.4 5A4.8 4.8 0 0 0 2 8.8c0 2 1.5 3.7 3 5.2l7 6.5z"/></svg>
                        </button>
                        <button id="btn-siguiente" class="btn btn-circle btn-ghost" aria-label="Frase siguiente">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                        </button>
                    </div>
                    <p id="posicion" class="text-sm" style="color: var(--faro-text-muted);"></p>

                    <div class="space-y-3 pt-2">
                        <button id="btn-agregar" class="text-base underline" style="color: var(--faro-text-muted);">Agregar una frase mía</button>
                        <button id="btn-volver" class="faro-btn-big faro-btn-ghost">Elegir otra categoría</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- AGREGAR FRASE PROPIA -->
        <section id="s-agregar" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-8 md:p-12">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h2 class="font-display text-2xl font-semibold text-base-content text-center">Tu propia frase</h2>
                    <p class="text-base text-center" style="color: var(--faro-text-secondary);">
                        Escríbela como te la dirías a ti mismo/a. Corta y con hechos.
                    </p>
                    <textarea id="campo-frase" class="faro-textarea" placeholder="Ej: Esto ya me ha pasado y siempre termina"></textarea>
                    <button id="btn-guardar-frase" class="faro-btn-big faro-btn-primary">Guardar frase</button>
                    <button id="btn-cancelar-frase" class="faro-btn-big faro-btn-ghost">Volver</button>
                </div>
            </div>
        </section>

    </div>
</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/declaraciones-de-seguridad.js"></script>
</body>
</html>
