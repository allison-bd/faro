<!DOCTYPE html>
<html lang="es" data-theme="faro-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probabilidad real · Faro</title>
    <script>(function(){try{var t=localStorage.getItem("faro-theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="faro-dark";if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/faro-base.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-base-100">

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar bg-neutral shadow-sm px-4 lg:px-8 sticky top-0 z-50">
    <div class="navbar-start">
        <a href="../index.html" class="flex items-center gap-2 text-neutral-content">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.5 3h-5z"/><rect x="9.5" y="5" width="5" height="2.5" rx="0.3"/><path d="M10 7.5L8.5 21h7L14 7.5z"/><path d="M9 13.5h6"/><path d="M6 21h12"/><path d="M16 5.5l2.5-1.3M16 6.8l2.6.4M8 5.5L5.5 4.2M8 6.8l-2.6.4"/>
            </svg>
            <span class="text-xl font-semibold font-display">Faro</span>
        </a>
    </div>
    <div class="navbar-center hidden md:flex">
        <ul class="menu menu-horizontal gap-1">
            <li><a href="../index.html" class="text-neutral-content hover:text-accent">Inicio</a></li>
            <li><a href="../herramientas.html" class="text-neutral-content hover:text-accent">Herramientas</a></li>
            <li><a href="../sobre-faro.html" class="text-neutral-content hover:text-accent">Sobre Faro</a></li>
        </ul>
    </div>
    <div class="navbar-end">
        <a href="../herramientas.html" class="btn btn-ghost text-neutral-content gap-1 px-2 md:hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Herramientas
        </a>
        <button id="theme-toggle" class="btn btn-ghost btn-circle text-neutral-content" aria-label="Cambiar tema">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
    </div>
</nav>

<main class="relative overflow-hidden bg-base-200 faro-surface" style="min-height: calc(100vh - 64px);">
    <div class="tool-bokeh-bg"></div>

    <div class="relative max-w-xl mx-auto px-4 py-8 md:py-12">

        <!-- PANTALLA 1 -->
        <section id="s-1" class="faro-screen active">
            <div class="tool-stage relative overflow-hidden p-8 md:p-12">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h1 class="font-display text-3xl font-semibold text-base-content text-center">Probabilidad real</h1>
                    <label for="campo-temor" class="block font-medium text-base-content">¿Qué temes que pase?</label>
                    <textarea id="campo-temor" class="faro-textarea"></textarea>
                    <button id="btn-1" class="faro-btn-big faro-btn-primary">Continuar</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA 2 -->
        <section id="s-2" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-8 md:p-12 text-center">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-8">
                    <h2 class="font-display text-2xl md:text-3xl font-semibold text-base-content">Ahora mismo, ¿qué probabilidad le das de que ocurra?</h2>
                    <div class="text-7xl font-bold text-primary font-display"><span id="valor-sentida">50</span>%</div>
                    <input type="range" id="slider-sentida" class="faro-slider" min="0" max="100" value="50" aria-label="Probabilidad que sientes de que ocurra, de 0 a 100 por ciento">
                    <button class="faro-btn-big faro-btn-primary" data-siguiente="s-3">Continuar</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA 3: EVIDENCIA -->
        <section id="s-3" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-8 md:p-12">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h2 class="font-display text-2xl font-semibold text-base-content text-center">Preguntas de evidencia</h2>
                    <div>
                        <label class="block font-medium text-base-content mb-2">¿Cuántas veces has temido algo parecido antes? ¿Cuántas veces realmente ocurrió?</label>
                        <textarea id="campo-ev1" class="faro-textarea" style="min-height: 4.5rem;"></textarea>
                    </div>
                    <div>
                        <label class="block font-medium text-base-content mb-2">De 100 personas en tu situación, ¿a cuántas crees que les pasaría esto?</label>
                        <textarea id="campo-ev2" class="faro-textarea" style="min-height: 4.5rem;"></textarea>
                    </div>
                    <div>
                        <label class="block font-medium text-base-content mb-2">¿Hay algún hecho concreto (no sensación) que respalde tu miedo?</label>
                        <textarea id="campo-ev3" class="faro-textarea" style="min-height: 4.5rem;"></textarea>
                    </div>
                    <button class="faro-btn-big faro-btn-primary" data-siguiente="s-4">Continuar</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA 4 -->
        <section id="s-4" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-8 md:p-12 text-center">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-8">
                    <h2 class="font-display text-2xl md:text-3xl font-semibold text-base-content">Con esta información, ¿qué probabilidad le darías ahora?</h2>
                    <div class="text-7xl font-bold text-primary font-display"><span id="valor-evaluada">50</span>%</div>
                    <input type="range" id="slider-evaluada" class="faro-slider" min="0" max="100" value="50" aria-label="Probabilidad con evidencia, de 0 a 100 por ciento">
                    <button id="btn-terminar" class="faro-btn-big faro-btn-primary">Ver la comparación</button>
                </div>
            </div>
        </section>

        <!-- COMPARACIÓN -->
        <section id="s-final" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-8 md:p-12 text-center">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-8">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-5 rounded-2xl" style="background: color-mix(in srgb, var(--color-error) 12%, var(--faro-card-bg));">
                            <p class="text-sm font-medium" style="color: var(--faro-text-secondary);">Probabilidad sentida</p>
                            <p id="num-sentida" class="text-5xl font-bold font-display" style="color: var(--color-error);"></p>
                        </div>
                        <div class="p-5 rounded-2xl" style="background: color-mix(in srgb, var(--color-success) 12%, var(--faro-card-bg));">
                            <p class="text-sm font-medium" style="color: var(--faro-text-secondary);">Probabilidad evaluada</p>
                            <p id="num-evaluada" class="text-5xl font-bold font-display" style="color: var(--color-success);"></p>
                        </div>
                    </div>
                    <p id="mensaje-final" class="font-display text-2xl leading-relaxed text-base-content"></p>
                    <div class="space-y-3">
                        <button id="btn-otro" class="faro-btn-big faro-btn-ghost">Evaluar otro miedo</button>
                        <a href="../index.html" class="faro-btn-big faro-btn-primary">Volver al inicio</a>
                    </div>
                </div>
            </div>
        </section>

    </div>
</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/probabilidad-real.js"></script>
</body>
</html>
