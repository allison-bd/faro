<!DOCTYPE html>
<html lang="es" data-theme="faro-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiración guiada · Faro</title>
    <script>(function(){try{var t=localStorage.getItem("faro-theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="faro-dark";if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/faro-base.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        /* Modo nocturno: capa más tenue sobre el ejercicio, para antes de dormir */
        body.modo-nocturno main { background: #12102A; }
        body.modo-nocturno .tool-bokeh-bg,
        body.modo-nocturno .tool-bokeh-card { opacity: 0.35; }
        body.modo-nocturno .tool-glow { opacity: 0.4; }
        body.modo-nocturno .tool-stage { background: #1A1430; box-shadow: 0 24px 48px -16px rgba(0,0,0,0.6); }
    </style>
</head>
<body class="bg-base-100">

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar bg-neutral shadow-sm px-4 lg:px-8 sticky top-0 z-50">
    <div class="navbar-start">
        <a href="../index.html" class="flex items-center gap-2 text-neutral-content">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.5 3h-5z"/><rect x="9.5" y="5" width="5" height="2.5" rx="0.3"/><path d="M10 7.5L8.5 21h7L14 7.5z"/><path d="M9 13.5h6"/><path d="M6 21h12"/><path d="M16 5.5l2.5-1.3M16 6.8l2.6.4M8 5.5L5.5 4.2M8 6.8l-2.6.4"/>
            </svg>
            <span class="text-xl font-semibold font-display">Faro</span>
        </a>
    </div>
    <div class="navbar-center hidden md:flex">
        <ul class="menu menu-horizontal gap-1">
            <li><a href="../index.html" class="text-neutral-content hover:text-accent">Inicio</a></li>
            <li><a href="../herramientas.html" class="text-neutral-content hover:text-accent">Herramientas</a></li>
            <li><a href="../sobre-faro.html" class="text-neutral-content hover:text-accent">Sobre Faro</a></li>
        </ul>
    </div>
    <div class="navbar-end">
        <a href="../herramientas.html" class="btn btn-ghost text-neutral-content gap-1 px-2 md:hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Herramientas
        </a>
        <button id="theme-toggle" class="btn btn-ghost btn-circle text-neutral-content" aria-label="Cambiar tema">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
    </div>
</nav>

<main class="relative overflow-hidden bg-base-200 faro-surface" style="min-height: calc(100vh - 64px);">
    <div class="tool-bokeh-bg"></div>
    <div class="tool-glow absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="width: 480px; height: 480px;"></div>

    <div class="relative max-w-xl mx-auto px-4 py-4 md:py-6">

        <!-- PANTALLA: SELECCIÓN DE VARIANTE -->
        <section id="s-config" class="faro-screen active">
            <div class="tool-stage relative overflow-hidden p-5 md:p-8">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-4">
                    <h1 class="font-display text-3xl font-semibold text-base-content text-center">Respiración guiada</h1>
                    <p class="faro-instruction text-center" style="color: var(--faro-text-secondary);">
                        Elige un ritmo. Solo tienes que seguirlo.
                    </p>

                    <div class="space-y-3" role="radiogroup" aria-label="Variante de respiración">
                        <button class="faro-option-card w-full p-4 selected" data-variante="cuadrada" role="radio" aria-checked="true">
                            <span class="font-semibold text-lg text-primary">Cuadrada 4-4-4-4</span>
                            <span class="block text-sm mt-1" style="color: var(--faro-text-secondary);">Inhala, sostén, exhala, sostén. 4 segundos cada uno.</span>
                        </button>
                        <button class="faro-option-card w-full p-4" data-variante="simple" role="radio" aria-checked="false">
                            <span class="font-semibold text-lg text-primary">Simple, 3 tiempos</span>
                            <span class="block text-sm mt-1" style="color: var(--faro-text-secondary);">Inhala, mantén, exhala con fuerza. Si la cuadrada te cuesta, empieza aquí.</span>
                        </button>
                        <button class="faro-option-card w-full p-4" data-variante="478" role="radio" aria-checked="false">
                            <span class="font-semibold text-lg text-primary">4-7-8, relajación profunda</span>
                            <span class="block text-sm mt-1" style="color: var(--faro-text-secondary);">La exhalación larga calma más. Ideal para la noche.</span>
                        </button>
                        <button class="faro-option-card w-full p-4" data-variante="abdominal" role="radio" aria-checked="false">
                            <span class="font-semibold text-lg text-primary">Abdominal libre</span>
                            <span class="block text-sm mt-1" style="color: var(--faro-text-secondary);">Sin conteo. El círculo te acompaña a tu propio ritmo.</span>
                        </button>
                    </div>

                    <div class="space-y-2 pt-1">
                        <label class="flex items-center justify-between gap-3 cursor-pointer p-2.5 rounded-xl" style="background: var(--faro-border-subtle);">
                            <span class="text-base font-medium text-base-content">Modo nocturno</span>
                            <input type="checkbox" id="chk-nocturno" class="toggle toggle-primary">
                        </label>
                        <label id="fila-vibracion" class="flex items-center justify-between gap-3 cursor-pointer p-2.5 rounded-xl hidden" style="background: var(--faro-border-subtle);">
                            <span class="text-base font-medium text-base-content">Vibración suave con el ritmo<br><span class="text-sm font-normal" style="color: var(--faro-text-muted);">Útil con los ojos cerrados</span></span>
                            <input type="checkbox" id="chk-vibracion" class="toggle toggle-primary">
                        </label>
                    </div>

                    <button id="btn-comenzar" class="faro-btn-big faro-btn-primary">Comenzar</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA: EJERCICIO -->
        <section id="s-ejercicio" class="faro-screen">
            <div class="tool-stage relative overflow-hidden px-6 py-12 md:p-16">
                <div class="tool-bokeh-card"></div>

                <!-- VISUAL CUADRADO (variante cuadrada) -->
                <div id="visual-cuadrado" class="relative hidden items-center justify-center mx-auto" style="width: 250px; height: 250px;">
                    <div class="absolute rounded-2xl border border-primary/20 pointer-events-none" style="width: 314px; height: 314px; top: -32px; left: -32px;"></div>
                    <div class="relative border-4 border-primary rounded-xl w-full h-full" style="background: var(--faro-card-bg); box-shadow: inset 0 2px 10px color-mix(in srgb, var(--color-primary) 15%, transparent);">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div id="text-scaler-sq" style="display:inline-block;">
                                <span id="texto-sq" class="text-3xl font-bold text-primary font-display" style="display:inline-block;">Inhala</span>
                            </div>
                        </div>
                    </div>
                    <div id="beacon" class="tool-beacon absolute flex items-center justify-center bg-secondary text-secondary-content rounded-full font-bold text-base" style="width: 40px; height: 40px; top: -22px; left: -22px;">
                        <span id="contador-sq">4</span>
                    </div>
                </div>

                <!-- VISUAL CÍRCULO (simple, 4-7-8, abdominal) -->
                <div id="visual-circulo" class="relative hidden items-center justify-center mx-auto" style="width: 280px; height: 280px;">
                    <div class="absolute rounded-full border border-primary/20 pointer-events-none" style="inset: -20px;"></div>
                    <div id="circulo" class="rounded-full flex items-center justify-center"
                         style="width: 170px; height: 170px; background: color-mix(in srgb, var(--color-primary) 22%, var(--faro-card-bg)); border: 4px solid var(--color-primary); transition: transform 4s linear;">
                        <div class="text-center">
                            <span id="texto-ci" class="block text-2xl font-bold text-primary font-display">Inhala</span>
                            <span id="contador-ci" class="block text-xl font-semibold mt-1" style="color: var(--faro-text-secondary);">4</span>
                        </div>
                    </div>
                </div>

                <!-- Estado accesible en texto (lectores de pantalla) -->
                <p id="fase-viva" class="sr-only" aria-live="polite"></p>

                <div class="relative mt-12 text-center">
                    <button id="btn-terminar" class="faro-btn-big faro-btn-ghost max-w-xs mx-auto">Terminar</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA: CIERRE Y AUTOEVALUACIÓN -->
        <section id="s-cierre" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-8 md:p-12">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-8 text-center">
                    <h2 class="font-display text-2xl md:text-3xl font-semibold text-base-content">¿Cómo te sientes ahora?</h2>
                    <div class="space-y-4">
                        <div class="text-6xl font-bold text-primary font-display" id="valor-cierre">5</div>
                        <input type="range" id="slider-cierre" class="faro-slider" min="0" max="10" value="5"
                               aria-label="Cómo te sientes, de 0 muy mal a 10 muy bien">
                        <div class="flex justify-between text-sm" style="color: var(--faro-text-muted);">
                            <span>0 · Muy mal</span><span>10 · Muy bien</span>
                        </div>
                    </div>
                    <p id="comparacion" class="faro-instruction hidden" style="color: var(--faro-text-secondary);"></p>
                    <div class="space-y-3">
                        <button id="btn-guardar" class="faro-btn-big faro-btn-primary">Guardar</button>
                        <button id="btn-repetir" class="faro-btn-big faro-btn-ghost">Respirar de nuevo</button>
                        <a href="../index.html" class="block text-base underline" style="color: var(--faro-text-secondary);">Volver al inicio</a>
                    </div>
                </div>
            </div>
        </section>

    </div>
</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/respiracion.js"></script>
</body>
</html>
