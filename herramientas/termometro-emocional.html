<!DOCTYPE html>
<html lang="es" data-theme="faro-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termómetro emocional · Faro</title>
    <script>(function(){try{var t=localStorage.getItem("faro-theme");if(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)t="faro-dark";if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/faro-base.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        /* Termómetro vertical con gradiente cálido suave (nunca rojo/verde agresivo) */
        /* Gradiente "to right": tras rotar el slider -90° queda de abajo (bajo)
           hacia arriba (alto), acompañando la escala 0→10 del termómetro. */
        #slider-animo.faro-slider {
            background: linear-gradient(to right,
                color-mix(in srgb, var(--faro-text-muted) 55%, var(--faro-slider-track)),
                color-mix(in srgb, var(--color-primary) 55%, var(--faro-slider-track)),
                color-mix(in srgb, var(--color-accent) 75%, var(--faro-slider-track)));
        }
        #pregunta-adaptativa { transition: opacity 0.5s ease; }
        #pregunta-adaptativa.cambiando { opacity: 0; }
    </style>
</head>
<body class="bg-base-100">

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar bg-neutral shadow-sm px-4 lg:px-8 sticky top-0 z-50">
    <div class="navbar-start">
        <a href="../index.html" class="flex items-center gap-2 text-neutral-content">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.5 3h-5z"/><rect x="9.5" y="5" width="5" height="2.5" rx="0.3"/><path d="M10 7.5L8.5 21h7L14 7.5z"/><path d="M9 13.5h6"/><path d="M6 21h12"/><path d="M16 5.5l2.5-1.3M16 6.8l2.6.4M8 5.5L5.5 4.2M8 6.8l-2.6.4"/>
            </svg>
            <span class="text-xl font-semibold font-display">Faro</span>
        </a>
    </div>
    <div class="navbar-center hidden md:flex">
        <ul class="menu menu-horizontal gap-1">
            <li><a href="../index.html" class="text-neutral-content hover:text-accent">Inicio</a></li>
            <li><a href="../herramientas.html" class="text-neutral-content hover:text-accent">Herramientas</a></li>
            <li><a href="../sobre-faro.html" class="text-neutral-content hover:text-accent">Sobre Faro</a></li>
        </ul>
    </div>
    <div class="navbar-end">
        <a href="../herramientas.html" class="btn btn-ghost text-neutral-content gap-1 px-2 md:hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Herramientas
        </a>
        <button id="theme-toggle" class="btn btn-ghost btn-circle text-neutral-content" aria-label="Cambiar tema">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
    </div>
</nav>

<main class="relative overflow-hidden bg-base-200 faro-surface" style="min-height: calc(100vh - 64px);">
    <div class="tool-bokeh-bg"></div>

    <div class="relative max-w-xl mx-auto px-4 py-8 md:py-12">

        <!-- REGISTRO DE HOY -->
        <section id="s-registro" class="faro-screen active">
            <div class="tool-stage relative overflow-hidden p-6 md:p-10">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h1 class="font-display text-3xl font-semibold text-base-content text-center">¿Dónde estás hoy?</h1>

                    <div class="flex items-center justify-center gap-8 py-4">
                        <div class="flex flex-col items-center gap-2">
                            <span class="text-sm" style="color: var(--faro-text-muted);">10</span>
                            <div class="faro-vslider-wrap">
                                <input type="range" id="slider-animo" class="faro-slider" data-no-fill min="0" max="10" value="5"
                                       aria-label="Estado emocional de 0 a 10">
                            </div>
                            <span class="text-sm" style="color: var(--faro-text-muted);">0</span>
                        </div>
                        <div class="text-center">
                            <span id="valor-animo" class="block text-7xl font-bold text-primary font-display">5</span>
                            <span class="text-base" style="color: var(--faro-text-muted);">de 10</span>
                        </div>
                    </div>

                    <div id="pregunta-adaptativa" class="space-y-4">
                        <p id="texto-pregunta" class="faro-instruction text-center font-medium text-base-content"></p>
                        <div id="enlaces-crisis" class="hidden space-y-2">
                            <a href="protocolo-de-crisis.html" class="faro-btn-big faro-btn-primary">Ir a las herramientas de crisis</a>
                        </div>
                        <textarea id="respuesta" class="faro-textarea" placeholder="Escribe lo que aparezca. No hay respuestas incorrectas."></textarea>
                    </div>

                    <button id="btn-guardar" class="faro-btn-big faro-btn-primary">Guardar</button>
                    <p id="confirmacion" class="hidden text-base text-center p-3 rounded-xl" style="background: var(--faro-success-bg); color: var(--color-success);"></p>
                    <button id="btn-historial" class="block mx-auto text-base underline" style="color: var(--faro-text-muted);">Ver mi evolución</button>
                </div>
            </div>
        </section>

        <!-- HISTORIAL -->
        <section id="s-historial" class="faro-screen">
            <div class="tool-stage relative overflow-hidden p-6 md:p-10">
                <div class="tool-bokeh-card"></div>
                <div class="relative space-y-6">
                    <h2 class="font-display text-2xl md:text-3xl font-semibold text-base-content text-center">Tu evolución</h2>
                    <p id="mensaje-cambio" class="hidden faro-instruction text-center p-4 rounded-xl" style="background: var(--faro-success-bg); color: var(--color-success);"></p>
                    <div id="grafico-wrap" class="overflow-x-auto">
                        <svg id="grafico-linea" width="100%" height="180" viewBox="0 0 560 180" preserveAspectRatio="none" role="img" aria-label="Gráfico de línea con tu estado emocional a lo largo del tiempo"></svg>
                    </div>
                    <p id="sin-datos" class="hidden faro-instruction text-center" style="color: var(--faro-text-secondary);">
                        Aún no hay registros suficientes. Cada día que registres, la línea irá contando tu historia.
                    </p>
                    <div id="lista-animo" class="space-y-2"></div>
                    <button id="btn-volver" class="faro-btn-big faro-btn-ghost">Volver</button>
                </div>
            </div>
        </section>

    </div>
</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/termometro-emocional.js"></script>
</body>
</html>
